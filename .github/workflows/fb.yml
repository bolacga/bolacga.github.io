name: Cap nhat bai Facebook
on:
  schedule:
    - cron: "17 * * * *"   # moi gio
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lay bai moi
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 .github/scripts/fb_feed.py
      - name: Luu neu doi
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/fb.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "fb: cap nhat bai moi" && git push)